; Transcoding worker: ONE process so FFmpeg can't starve the API.
; The "video" connection (config/queue.php) has retry_after 7500s > the job's 7200s timeout.
[program:soaar-video-worker]
command=php /var/www/soar/artisan queue:work video --queue=video --timeout=7200 --tries=1 --sleep=5
directory=/var/www/soar
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=7300
redirect_stderr=true
stdout_logfile=/var/www/soar/storage/logs/video-worker.log
