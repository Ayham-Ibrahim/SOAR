name = "soaar-media"
main = "src/index.js"
compatibility_date = "2026-10-01"

routes = [{ pattern = "media.soaar.tech", custom_domain = true }]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "soar-video"

[vars]
KEY_BASE = "https://api.soaar.tech/api/videos"
# Comma-separated origins allowed to play from a browser (dashboard preview).
ALLOWED_ORIGINS = "https://DASHBOARD_DOMAIN"

# Secret (same value as Laravel's VIDEO_TOKEN_SECRET):
#   npx wrangler secret put VIDEO_TOKEN_SECRET
